# Compile the Apple shims and run every Apple self-test, on a self-hosted Mac (#46).
#
# Nothing else can: AppKit and UIKit are only in Xcode's SDKs, so the Swift is otherwise
# written on Linux and never compiled — which is how #49 shipped a call to a helper that did
# not exist. The work is all in bin/verify-apple.sh, so a run here and a run by hand on the
# Mac are the same thing.
#
# SECURITY. This repository is public and the runner is a personal Mac, so this workflow
# never runs on `pull_request`: that event would run a stranger's fork on it. It runs on
# `push`, which needs write access to this repository, and by hand. A PR from a branch here
# still gets the check, because the push that updated the branch ran it on the same commit.
# Keep it that way; and in the repository settings, keep "Require approval for all outside
# collaborators" on for fork workflows.
#
# The runner must be registered with the labels below and run as a LaunchAgent in a
# logged-in session (`./svc.sh install` from the runner directory does that), because the
# macOS self-tests open real windows. It needs Xcode, an 'iPhone 17' simulator, a JDK and
# sbt on its PATH.
#
# After `./svc.sh install`, delete `SessionCreate` from the LaunchAgent's plist and restart
# it (`/usr/libexec/PlistBuddy -c "Delete :SessionCreate" ~/Library/LaunchAgents/actions.runner.*.plist`,
# then `./svc.sh stop && ./svc.sh start`). GitHub's template sets it, which puts the runner in
# a security session of its own, outside the logged-in GUI session: AppKit still runs there,
# but the window server does not show its windows, so an app's window cannot be found
# (measured: windows=0 for an app that was up, until it was removed).

name: Apple

on:
  push:
  workflow_dispatch:
    inputs:
      device:
        description: Simulator to run the iOS self-tests on
        default: iPhone 17

permissions:
  contents: read

concurrency:
  group: apple-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # A fork that copies this workflow must not find a runner with these labels.
    if: github.repository == 'rleibman/thicket'
    runs-on: [self-hosted, macOS, ARM64, thicket-apple]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The version comes from `git describe`, which needs the tags.
          fetch-depth: 0

      - name: Build the shims and run the Apple self-tests
        run: bin/verify-apple.sh "${{ inputs.device || 'iPhone 17' }}"

      - name: Keep the logs, screenshots and summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apple-verify-${{ github.sha }}
          path: target/apple-verify/
          if-no-files-found: warn
