org.gradle.jvmargs=-Xmx2g
android.useAndroidX=true

# MANDATORY for Scala (S2). R8 full mode strips the backing field of a `lazy val` even
# when -keepclassmembers says otherwise, because Scala 3 resolves that field reflectively
# by name via MethodHandles.findVarHandle. The app then dies at launch inside
# scala.math.BigDecimal$ with `NoSuchFieldException: No field cache$lzy1`.
android.enableR8.fullMode=false
