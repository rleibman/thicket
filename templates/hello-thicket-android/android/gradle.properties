org.gradle.jvmargs=-Xmx2g
android.useAndroidX=true

# Required for Scala. R8's full mode (AGP's default) strips lazy vals' backing fields even
# when scala3.pro keeps them, and the app then dies at class initialisation inside the Scala
# library (measured in phase 0, S2; docs/09 §9.3c).
android.enableR8.fullMode=false
